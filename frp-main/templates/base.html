{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'images/favicon.png' %}?v=2"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="color-scheme"
        content="light dark"
    >

    <meta
        name="theme-color"
        content="#f8fafc"
        id="themeColorMeta"
    >

    <title>
        {% block title %}
        Faculty Review Portal
        {% endblock %}
    </title>


    <!-- =========================================
         PREVENT LIGHT / DARK FLASH
    ========================================== -->

    <script>
        (function () {

            const savedTheme =
                localStorage.getItem("portal-theme");

            if (savedTheme === "dark") {

                document.documentElement.setAttribute(
                    "data-theme",
                    "dark"
                );

            } else {

                document.documentElement.setAttribute(
                    "data-theme",
                    "light"
                );

            }

        })();
    </script>


    <!-- =========================================
         GOOGLE FONT
    ========================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         BOOTSTRAP CSS
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================================
         FONT AWESOME
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =========================================
         SWEETALERT2
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>


    <!-- =========================================
         EXISTING PROJECT CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- =========================================
         THEME SYSTEM
    ========================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/theme.css' %}"
    >


    <!-- =========================================
         SWEETALERT2 Z-INDEX FIX
    ========================================== -->

    <style>

        /*
         * SweetAlert must always stay
         * above the login page/card.
         */

        .swal2-container {
            z-index: 999999 !important;
        }

        .swal2-popup {
            z-index: 1000000 !important;
        }

        .swal2-backdrop-show {
            z-index: 999998 !important;
        }

    </style>

</head>


<body style="overflow-x: hidden;">


    <!-- =========================================
         PAGE CONTENT
    ========================================== -->

    {% block content %}
    {% endblock %}



    <!-- =========================================
         GLOBAL THEME TOGGLE
         HIDDEN ON ADMIN LOGIN PAGE
    ========================================== -->

    {% if request.resolver_match.url_name != 'admin_login' %}

    <div
        id="themeToggleWrapper"
        aria-label="Theme controls"
    >

        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark and light mode"
            title="Toggle theme"
        >

            <i
                id="themeIcon"
                class="fa-solid fa-moon"
            ></i>

            <span id="themeText">
                Dark
            </span>

        </button>

    </div>

    {% endif %}



    <!-- =========================================
         BOOTSTRAP JAVASCRIPT
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =========================================
         MAIN JAVASCRIPT
         NOT REQUIRED ON ADMIN LOGIN
    ========================================== -->

    {% if request.resolver_match.url_name != 'admin_login' %}

    <script
        src="{% static 'js/main.js' %}">
    </script>

    {% endif %}



    <!-- =========================================
         GLOBAL THEME CONTROLLER
    ========================================== -->

    <script
        src="{% static 'js/theme.js' %}">
    </script>



    <!-- =========================================
         GLOBAL DJANGO ERROR MESSAGE ALERT
    ========================================== -->

    {% if messages %}

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                {% for message in messages %}

                {% if message.tags == 'error' %}

                Swal.fire({

                    /* =========================
                       ALERT TYPE
                    ========================= */

                    icon: "error",


                    /* =========================
                       ALERT TITLE
                    ========================= */

                    title: "Login Failed",


                    /* =========================
                       ALERT MESSAGE
                    ========================= */

                    text:
                        "{{ message|escapejs }}",


                    /* =========================
                       OK BUTTON
                    ========================= */

                    showConfirmButton: true,

                    confirmButtonText: "OK",

                    confirmButtonColor: "#2563eb",


                    /* =========================
                       NO AUTO CLOSE
                    ========================= */

                    timer: undefined,

                    timerProgressBar: false,


                    /* =========================
                       USER INTERACTION
                    ========================= */

                    allowOutsideClick: true,

                    allowEscapeKey: true,


                    /* =========================
                       CUSTOM STYLE
                    ========================= */

                    customClass: {

                        popup:
                            "portal-swal-popup"

                    }

                });

                {% endif %}

                {% endfor %}

            }
        );

    </script>

    {% endif %}



    <!-- =========================================
         ADMIN LOGIN LAYER / CLICK FIX
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const loginPage =
                    document.querySelector(
                        ".admin-login-page"
                    );

                if (!loginPage) {
                    return;
                }


                /* =========================
                   LOGIN PAGE
                ========================= */

                loginPage.style.position =
                    "relative";

                loginPage.style.zIndex =
                    "9999";


                /* =========================
                   LOGIN CARD
                ========================= */

                const loginCard =
                    document.querySelector(
                        ".login-card"
                    );


                if (loginCard) {

                    loginCard.style.position =
                        "relative";

                    loginCard.style.zIndex =
                        "10000";

                    loginCard.style.pointerEvents =
                        "auto";

                }


                /* =========================
                   LOGIN CONTROLS
                ========================= */

                document.querySelectorAll(
                    ".login-card button, " +
                    ".login-card a, " +
                    ".login-card input"
                ).forEach(
                    function (element) {

                        element.style.position =
                            "relative";

                        element.style.zIndex =
                            "10001";

                        element.style.pointerEvents =
                            "auto";

                        element.style.touchAction =
                            "manipulation";

                    }
                );

            }
        );

    </script>


</body>

</html>
