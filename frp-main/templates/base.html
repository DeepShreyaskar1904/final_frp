{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <link
    rel="icon"
    type="image/png"
    href="{% static 'images/favicon.png' %}?v=2"
>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="color-scheme"
        content="light dark"
    >

    <meta
        name="theme-color"
        content="#f8fafc"
        id="themeColorMeta"
    >

    <title>
        {% block title %}
        Faculty Review Portal
        {% endblock %}
    </title>

    <!-- Prevent light/dark flash before CSS loads -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem("portal-theme");

            if (savedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Existing project CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    <!-- NEW: theme system -->
    <link
        rel="stylesheet"
        href="{% static 'css/theme.css' %}"
    >
</head>

<body>

    {% block content %}
    {% endblock %}

    <!-- Global theme toggle -->
    <div
        id="themeToggleWrapper"
        aria-label="Theme controls"
    >
        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark and light mode"
            title="Toggle theme"
        >
            <i
                id="themeIcon"
                class="fa-solid fa-moon"
            ></i>

            <span id="themeText">
                Dark
            </span>
        </button>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="{% static 'js/main.js' %}">
    </script>

    <!-- NEW: global theme controller -->
    <script
        src="{% static 'js/theme.js' %}">
    </script>

    {% if messages %}

    <script>

        {% for message in messages %}

        Swal.fire({

            icon:
                "{% if message.tags == 'error' %}error{% else %}success{% endif %}",

            title:
                "{% if message.tags == 'error' %}Login Failed{% else %}Success{% endif %}",

            text:
                "{{ message|escapejs }}",

            confirmButtonText:
                "OK",

            customClass: {
                popup: "portal-swal-popup",
                confirmButton: "portal-swal-confirm"
            }

        });

        {% endfor %}

    </script>

    {% endif %}

</body>
</html>
