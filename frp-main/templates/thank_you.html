{% extends 'base.html' %}

{% block title %}
Thank You | Faculty Review Portal
{% endblock %}


{% block content %}

<style>

/* =====================================================
   THANK YOU PAGE
===================================================== */

.thank-you-page {
    min-height: calc(100vh - 80px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;

    background: #f7f9fc;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}


/* =====================================================
   THANK YOU CARD
===================================================== */

.thank-you-card {

    width: 100%;
    max-width: 590px;

    padding: 65px 45px;

    text-align: center;

    background: #ffffff;

    border: 3px solid #cbd5e1;

    border-radius: 26px;

    box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08);

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}


/* =====================================================
   SUCCESS ICON
===================================================== */

.success-icon {

    width: 86px;
    height: 86px;

    margin: 0 auto 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #dcfce7;

    color: #16a34a;

    font-size: 40px;
}


/* =====================================================
   TITLE
===================================================== */

.thank-you-card h1 {

    margin: 0 0 18px;

    font-size: 42px;
    font-weight: 800;

    color: #111827;

    letter-spacing: -0.8px;
}


/* =====================================================
   MAIN TEXT
===================================================== */

.thank-you-card p {

    margin: 0 0 18px;

    font-size: 17px;
    line-height: 1.6;

    color: #52627a;
}


/* =====================================================
   SMALL TEXT
===================================================== */

.thank-you-card .small-text {

    margin-bottom: 34px;

    font-size: 15px;

    color: #718096;
}


/* =====================================================
   BACK TO HOME BUTTON
===================================================== */

.btn-primary-custom {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 170px;

    padding: 14px 24px;

    border-radius: 12px;

    background: #2563eb;

    color: #ffffff !important;

    font-size: 16px;
    font-weight: 600;

    text-decoration: none;

    border: none;

    box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.22);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}


.btn-primary-custom:hover {

    background: #1d4ed8;

    color: #ffffff !important;

    transform: translateY(-2px);

    box-shadow:
        0 12px 25px rgba(37, 99, 235, 0.28);
}


/* =====================================================
   DARK MODE
===================================================== */

html[data-theme="dark"] .thank-you-page {

    background: #0f172a;
}


html[data-theme="dark"] .thank-you-card {

    background: #1e293b;

    border-color: #334155;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
}


html[data-theme="dark"] .success-icon {

    background: #143b2a;

    color: #4ade80;
}


html[data-theme="dark"] .thank-you-card h1 {

    color: #f8fafc;
}


html[data-theme="dark"] .thank-you-card p {

    color: #cbd5e1;
}


html[data-theme="dark"] .thank-you-card .small-text {

    color: #94a3b8;
}


html[data-theme="dark"] .btn-primary-custom {

    background: #3b82f6;

    color: #ffffff !important;
}


html[data-theme="dark"] .btn-primary-custom:hover {

    background: #2563eb;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .thank-you-page {

        padding: 25px 15px;

    }

    .thank-you-card {

        padding: 45px 25px;

        border-radius: 20px;

    }

    .success-icon {

        width: 72px;
        height: 72px;

        font-size: 32px;

        margin-bottom: 22px;

    }

    .thank-you-card h1 {

        font-size: 34px;

    }

    .thank-you-card p {

        font-size: 16px;

    }

}
.thank-you-card {
    width: 100%;
    max-width: 590px;

    padding: 65px 45px;

    text-align: center;

    background: #ffffff;

    border: 3px solid #cbd5e1;

    border-radius: 26px;

    box-shadow:
        0 12px 35px rgba(15, 23, 42, 0.08);

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}
html[data-theme="dark"] .thank-you-card {
    background: #1e293b;

    border-color: #475569;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
}
</style>


<div class="thank-you-page">

    <div class="thank-you-card">

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1>
            Thank You!
        </h1>


        <p>
            Your feedback has been submitted successfully.
        </p>


        <p class="small-text">

            Your response will help improve the
            learning experience.

        </p>


        <a
            href="{% url 'home' %}"
            class="btn btn-primary-custom"
        >

            Back to Home

        </a>

    </div>

</div>

{% endblock %}
